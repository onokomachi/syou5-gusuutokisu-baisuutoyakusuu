<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 文字の形（Google Fonts）は、アプリ本体と同時に読みはじめる（CSS の @import だと本体の CSS を読んだあとになり、白い画面が長くなる） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;family=DotGothic16&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;700&amp;family=Share+Tech+Mono&amp;display=swap" />
    <meta name="color-scheme" content="light dark" />
    <title>かずのせいしつラボ｜偶数・奇数と倍数・約数</title>
    <!-- テーマの FOUC（白フラッシュ）防止 その1:
         <head> の時点では document.body は未生成（null）なので、ここでは必ず存在する
         documentElement（<html>）に背景色を即時セットする。これで最初のペイントから
         白ではなくテーマ色（ダーク=真っ黒）になる。 -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('suusei_settings_v1');
          var theme = (raw && JSON.parse(raw).state && JSON.parse(raw).state.theme) || 'light';
          var BG = { light: '#eef2f7', dark: '#000000', aurora: '#020309', sakura: '#0d0416', inferno: '#0a0100', tenkuu: '#041022' };
          var bg = BG[theme] || '#eef2f7';
          window.__theme = theme;
          document.documentElement.style.backgroundColor = bg;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"><!-- 読みこみ中の表示（React が起動すると、この中身は入れかわって消える。0.4秒より早く読めたときは出ない） -->
      <div class="boot-loading" role="status" aria-live="polite">
        <style>
          .boot-loading{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;animation:boot-in .3s ease-out .4s forwards;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
          .boot-loading .boot-card{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 28px;border-radius:18px;background:rgba(255,255,255,.92);color:#334155;box-shadow:0 6px 24px rgba(15,23,42,.14)}
          .boot-loading .boot-name{font-size:17px;font-weight:800;letter-spacing:.02em}
          .boot-loading .boot-msg{font-size:13px;color:#64748b}
          .boot-loading .boot-ring{width:26px;height:26px;border-radius:50%;border:3px solid #cbd5e1;border-top-color:#3b82f6;animation:boot-spin .9s linear infinite}
          @keyframes boot-in{to{opacity:1}}
          @keyframes boot-spin{to{transform:rotate(360deg)}}
          @media (prefers-reduced-motion: reduce){.boot-loading .boot-ring{animation-duration:2.4s}}
        </style>
        <div class="boot-card"><div class="boot-ring"></div><div class="boot-name">かずのせいしつラボ</div><div class="boot-msg">よみこみちゅう…</div></div>
      </div>
    </div>
    <!-- FOUC 防止 その2: body 生成後（React 起動前）に data-theme と背景色を同期適用する。
         React の useEffect 適用より前なので、初回ペイントで正しいテーマになる。 -->
    <script>
      (function () {
        try {
          var theme = window.__theme || 'light';
          var BG = { light: '#eef2f7', dark: '#000000', aurora: '#020309', sakura: '#0d0416', inferno: '#0a0100', tenkuu: '#041022' };
          var bg = BG[theme] || '#eef2f7';
          document.body.setAttribute('data-theme', theme);
          document.body.style.backgroundColor = bg;
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
