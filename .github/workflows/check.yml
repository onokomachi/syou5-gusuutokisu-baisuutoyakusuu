# 単元アプリ用 CI テンプレート。
# このファイルをアプリの .github/workflows/check.yml にコピーする。
#
# push / PR のたびに `npm run check` を実行する。
# check は package.json で「lint → build → verify → audit」を直列に走らせる想定。
# 人間（やClaude）が実行を忘れても、問題データの不正・レベル定義のズレを機械的に止める。

name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
