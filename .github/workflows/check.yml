# 単元アプリ用 CI テンプレート（learning-app-kit が配る）。
# このファイルをアプリの .github/workflows/check.yml にコピーする。
#
# - push / PR のたびに `npm run check` を実行する（型チェック・ビルド・問題の検証・学級ポータルのルール点検）。
#   人間（やClaude）が実行を忘れても、問題データの不正・共通ファイルのずれを機械的に止める。
# - 毎週月曜の朝（日本時間 7:00）に、kit の最新と見くらべる（watch）。kit の直しが届いていなければ失敗し、
#   GitHub からリポジトリの持ち主にメールが届く。トークンは使わない（kit は公開リポジトリ）。

name: check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 22 * * 0'
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  watch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: kit の最新と見くらべる
        run: npx learning-app-kit-platform watch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
